# One-time setup after the first deploy:
#   databricks bundle run food_delivery_setup -t dev
# Creates schemas, volumes and the mask function, writes 7 days of history, starts the
# streaming pipeline (and waits for the data), then runs the batch pipeline once.
resources:
  jobs:
    food_delivery_setup:
      name: food_delivery_setup
      description: Creates the demo schemas and landing volume, backfills history, starts the streaming pipeline and runs the batch pipeline.
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: admin_group
          default: ${var.admin_group}
        - name: mode
          default: backfill
        - name: backfill_days
          default: "7"
        - name: restaurants_source
          default: ${workspace.file_path}/data/restaurants.csv
        - name: streaming_pipeline_id
          default: ${resources.pipelines.food_delivery_streaming.id}
        - name: full_refresh
          default: "false"
      tasks:
        - task_key: create_schemas_and_volume
          notebook_task:
            notebook_path: ../src/setup/00_setup.py
        - task_key: backfill_history
          depends_on:
            - task_key: create_schemas_and_volume
          notebook_task:
            notebook_path: ../src/generator/generate_events.py
        - task_key: start_streaming_pipeline
          depends_on:
            - task_key: backfill_history
          notebook_task:
            notebook_path: ../src/setup/start_streaming_pipeline.py
        - task_key: run_batch_pipeline
          depends_on:
            - task_key: start_streaming_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.food_delivery_batch.id}
