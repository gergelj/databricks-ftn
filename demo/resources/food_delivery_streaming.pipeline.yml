# Streaming pipeline: orders, courier GPS and customer changes, processed continuously.
# The pipeline itself is triggered; the continuous job food_delivery_streaming_job
# (food_delivery_streaming.job.yml) keeps it running. Batch vs streaming is a trigger, not a different codebase.
#   databricks bundle run food_delivery_streaming -t dev     # one triggered update
resources:
  pipelines:
    food_delivery_streaming:
      name: food_delivery_streaming
      catalog: ${var.catalog}
      schema: silver
      serverless: true
      channel: CURRENT
      root_path: ../src/pipelines/streaming
      libraries:
        - glob:
            include: ../src/pipelines/streaming/**
      configuration:
        landing_path: /Volumes/${var.catalog}/landing/raw
