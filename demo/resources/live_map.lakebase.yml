# Lakebase (serverless Postgres) for the live courier map app.
#
#   silver.gps_events (Delta, streaming pipeline)
#        │  continuous synced table (Change Data Feed, ~seconds)
#        ▼
#   Lakebase project food-delivery-live ─▶ Postgres table live.courier_gps ─▶ app courier-live-map
#
# The synced table is read-only in Postgres; the app only reads from it.
resources:
  postgres_projects:
    live_map_db:
      project_id: food-delivery-live
      display_name: Food delivery live map
      pg_version: 17
      default_endpoint_settings:
        autoscaling_limit_min_cu: 0.5
        autoscaling_limit_max_cu: 2
        suspend_timeout_duration: 300s   # scale to zero after 5 idle minutes

  # Registers the Lakebase database in Unity Catalog, so synced tables can target it.
  postgres_catalogs:
    live_map_catalog:
      catalog_id: food_delivery_live
      postgres_database: databricks_postgres
      branch: ${resources.postgres_projects.live_map_db.name}/branches/production

  postgres_synced_tables:
    courier_gps:
      synced_table_id: ${resources.postgres_catalogs.live_map_catalog.catalog_id}.live.courier_gps
      source_table_full_name: ${var.catalog}.silver.gps_events
      primary_key_columns: [courier_id, order_id, event_type, event_ts]
      scheduling_policy: CONTINUOUS
      branch: ${resources.postgres_projects.live_map_db.name}/branches/production
      postgres_database: databricks_postgres
      create_database_objects_if_missing: true
      new_pipeline_spec:
        storage_catalog: ${var.catalog}
        storage_schema: silver
